<title>Rétroplanning Expat</title>
<style>
  :root{
    --bg:#070b18; --ink:#eef2ff; --muted:#8d97b8; --line:rgba(255,255,255,.08); --glass:rgba(255,255,255,.055);
    --accent:#6d8cff; --danger:#ff5d6c; --today:#ff6b6b;
    --card-w:196px; --level-step:86px; --lane-step:42px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;
    background-image:radial-gradient(1200px 600px at 8% -10%,rgba(109,140,255,.22),transparent 60%),
                     radial-gradient(900px 500px at 92% 110%,rgba(244,114,182,.16),transparent 60%),
                     radial-gradient(700px 400px at 55% 50%,rgba(34,211,238,.06),transparent 60%)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- Barre du haut ---------- */
  .top{position:fixed;inset:0 0 auto 0;z-index:30;display:flex;flex-direction:column;gap:8px;padding:12px 22px 10px;
    background:linear-gradient(180deg,rgba(7,11,24,.95),rgba(7,11,24,.75) 80%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top{transition:padding-right .25s cubic-bezier(.2,.8,.2,1)}
  body.drawer-open .top{padding-right:442px}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;
    background:linear-gradient(90deg,#fff,#b7c6ff 60%,#8ee7ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
  .legend{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--glass);padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:#d5dcf5;transition:.15s}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
  .chip:hover{background:rgba(255,255,255,.1)}
  .chip.off{opacity:.38;text-decoration:line-through}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:6px}
  .btn{border:1px solid var(--line);background:var(--glass);padding:8px 13px;border-radius:10px;font-weight:600;color:var(--ink);transition:.15s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn.icon{padding:8px 11px;min-width:36px;text-align:center}
  .btn.primary{background:linear-gradient(135deg,#6d8cff,#8b5cf6);border-color:transparent;box-shadow:0 6px 24px rgba(109,140,255,.35)}
  .btn.primary:hover{filter:brightness(1.1)}
  .btn.danger{color:#ffb4bb;border-color:rgba(255,93,108,.35)}
  .btn.danger:hover{background:rgba(255,93,108,.15)}
  .years{display:flex;background:var(--glass);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .years button{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted)}
  .years button:hover{color:#fff;background:rgba(255,255,255,.08)}
  .dirty{display:none;align-items:center;gap:6px;color:#ffd166;font-weight:600;font-size:12px}
  .dirty.on{display:inline-flex}
  .dirty::before{content:"";width:7px;height:7px;border-radius:50%;background:#ffd166;box-shadow:0 0 8px #ffd166}

  /* ---------- Scène ---------- */
  .stage{position:absolute;inset:0;overflow:auto;cursor:grab;padding-top:110px}
  .stage.drag{cursor:grabbing;user-select:none}
  .canvas{position:relative;margin:0 60px}
  .yr-mark{position:absolute;top:0;bottom:0;pointer-events:none}
  .yr-mark .big{position:absolute;left:0;top:10px;font-size:150px;font-weight:900;letter-spacing:-6px;color:rgba(255,255,255,.035);line-height:1;user-select:none}
  .yr-mark .sep{position:absolute;left:0;top:0;bottom:0;border-left:1px dashed rgba(255,255,255,.14)}
  .mgrid{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.045);pointer-events:none}

  /* axe */
  .axis{position:absolute;left:0;right:0;height:16px;border-radius:999px;
    background:linear-gradient(90deg,#4f7cff,#22d3ee,#34d399,#facc15,#fb923c,#f472b6,#a78bfa,#4f7cff);
    box-shadow:0 0 30px rgba(109,140,255,.45),0 0 2px rgba(255,255,255,.6) inset}
  .axis::after{content:"";position:absolute;inset:0;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%,rgba(0,0,0,.25))}
  .tick{position:absolute;width:1px;height:26px;background:rgba(255,255,255,.35);transform:translateY(-5px)}
  .mlabel{position:absolute;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#aab4d6;white-space:nowrap;transform:translateX(-50%)}
  .mlabel b{display:block;color:#fff;font-size:12px;letter-spacing:.4px;text-transform:none}
  .ypill{position:absolute;transform:translate(-50%,-50%);background:#0b1024;border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px;letter-spacing:1px;box-shadow:0 0 18px rgba(109,140,255,.6);z-index:4}
  .today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--today);box-shadow:0 0 14px var(--today);z-index:3;pointer-events:none}
  .today span{position:absolute;left:50%;transform:translate(-50%,-50%);background:var(--today);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.3px;box-shadow:0 0 14px var(--today)}

  /* jalons */
  .stem{position:absolute;width:2px;transform:translateX(-1px);background:linear-gradient(180deg,var(--c),rgba(255,255,255,.08));opacity:.8;pointer-events:none}
  .dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid #0b1024;box-shadow:0 0 0 2px var(--c),0 0 16px var(--c);transform:translate(-50%,-50%);z-index:5;cursor:pointer;transition:transform .15s}
  .dot:hover{transform:translate(-50%,-50%) scale(1.3)}
  .card{position:absolute;width:var(--card-w);background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);
    border-radius:12px;padding:8px 10px 8px 13px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .18s,box-shadow .18s,border-color .18s;z-index:2}
  .card::before{content:"";position:absolute;left:-1px;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--c);box-shadow:0 0 10px var(--c)}
  .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.3);box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 1px var(--c) inset;z-index:6}
  .card .d{font-size:10.5px;font-weight:800;color:var(--c);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .card .d em{font-style:normal;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .card .t{font-weight:700;font-size:12.5px;line-height:1.25;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .st{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.1);color:#cfd6f3;margin-left:auto;letter-spacing:.2px;text-transform:none;flex:0 0 auto}
  .card .st.planifie{display:none}
  .st.termine{background:rgba(52,211,153,.2);color:#8ff0c9}
  .st.en-cours{background:rgba(109,140,255,.25);color:#c1cfff}
  .st.en-retard{background:rgba(255,93,108,.25);color:#ffb4bb}
  .st.annule{background:rgba(255,255,255,.08);color:#98a0bd;text-decoration:line-through}
  .selected.card,.selected.bar{outline:2px solid #fff;outline-offset:2px}

  /* périodes */
  .bar{position:absolute;height:32px;border-radius:9px;display:flex;align-items:center;gap:8px;padding:0 12px;cursor:pointer;color:#fff;font-weight:700;font-size:12.5px;white-space:nowrap;
    background:linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 75%,#000));
    box-shadow:0 8px 22px color-mix(in srgb,var(--c) 45%,transparent),0 0 0 1px rgba(255,255,255,.12) inset;transition:transform .15s,filter .15s;z-index:2;overflow:visible}
  .bar:hover{transform:translateY(-2px);filter:brightness(1.12);z-index:6}
  .bar .in{overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .bar .in small{opacity:.85;font-weight:600;margin-left:6px}
  .bar .out{position:absolute;left:100%;margin-left:10px;color:#dfe5ff;font-weight:600;text-shadow:0 1px 3px #000;overflow:hidden;text-overflow:ellipsis}
  .bar .out small{margin-left:6px;opacity:.75}
  .bar.termine{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 7px,transparent 7px 14px),linear-gradient(180deg,color-mix(in srgb,var(--c) 92%,#fff),color-mix(in srgb,var(--c) 75%,#000))}
  .bar.annule{opacity:.4}
  .bar .tip{position:absolute;left:8px;top:-15px;font-size:10px;color:#b9c3e8;font-weight:600;letter-spacing:.3px}
  .empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted)}

  .intro .card{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*28ms)}
  .intro .bar{animation:grow .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*28ms + 200ms);transform-origin:left center}
  .intro .dot,.intro .stem{animation:fade .5s both;animation-delay:calc(var(--i)*28ms)}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes grow{from{opacity:0;transform:scaleX(.2)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ---------- Panneau ---------- */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;z-index:50;background:rgba(12,17,36,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border-left:1px solid rgba(255,255,255,.12);box-shadow:-20px 0 60px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .drawer h2{margin:0;font-size:15px;font-weight:800}
  .drawer .body{padding:18px 20px;overflow-y:auto;flex:1}
  .drawer footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:8px}
  .x:hover{background:rgba(255,255,255,.1);color:#fff}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.6px;text-transform:uppercase}
  .field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:9px 11px;background:rgba(255,255,255,.06);color:#fff;color-scheme:dark}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(109,140,255,.6);border-color:var(--accent)}
  .field textarea{min-height:100px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;border:1px solid rgba(255,255,255,.14);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border:0;background:transparent;padding:9px;font-weight:700;color:var(--muted)}
  .seg button.on{background:linear-gradient(135deg,#6d8cff,#8b5cf6);color:#fff}
  .colors{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.15) inset}
  .sw.on{border-color:#fff}
  .colors input[type=color]{width:36px;height:30px;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:2px;background:transparent}
  .meta{font-size:12px;color:var(--muted);margin:-6px 0 12px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#fff;color:#0b1024;padding:11px 18px;border-radius:12px;opacity:0;transition:all .25s;z-index:60;font-weight:600;font-size:13px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:92vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .help{color:var(--muted);font-size:11.5px;white-space:nowrap}
  .help b{color:#cfd6f3}

  @media (max-width:760px){
    :root{--card-w:170px;--level-step:96px}
    .top{padding:10px 14px;gap:8px}
    .brand h1{font-size:17px}
    .years,.help{display:none}
    .brand small{display:none}
    body.drawer-open .top{padding-right:14px}
    .stage{padding-top:150px}
    .canvas{margin:0 16px}
  }
</style>
</head>

<script>
(function () {
  // Copie du document d'origine, capturée avant tout rendu : gabarit pour « Enregistrer et générer ».
  var TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var DATA = JSON.parse(document.getElementById('retro-data').textContent);
  var state = { selected: null, dirty: false, hidden: {}, zoom: 190, intro: true };
  var DAY = 86400000, MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var MSHORT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  var PALETTE = ['#7c9cff','#22d3ee','#34d399','#facc15','#fb923c','#f472b6','#a78bfa','#f87171','#4ade80','#38bdf8','#e879f9','#fbbf24'];
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Dates ----------
  function parseD(s) { var p = String(s).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function iso(t) { return new Date(t).toISOString().slice(0, 10); }
  function validISO(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(parseD(s)); }
  function fmtFR(s) { if (!validISO(s)) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function fmtLong(s) { if (!validISO(s)) return ''; var d = new Date(parseD(s)); return d.getUTCDate() + ' ' + MSHORT[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
  function monthStart(t) { var d = new Date(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); }
  function addMonths(t, n) { var d = new Date(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1); }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  // ---------- Modèle ----------
  function findItem(id) { for (var i = 0; i < DATA.items.length; i++) if (DATA.items[i].id === id) return DATA.items[i]; return null; }
  function catColor(name) {
    for (var i = 0; i < DATA.categories.length; i++) if (DATA.categories[i].name === name) return DATA.categories[i].color;
    return '#9aa3c7';
  }
  function ensureCategory(name) {
    if (!name) return;
    for (var i = 0; i < DATA.categories.length; i++) if (DATA.categories[i].name === name) return;
    DATA.categories.push({ name: name, color: PALETTE[DATA.categories.length % PALETTE.length] });
    renderLegend();
  }
  function itemColor(it) { return it.color || catColor(it.category); }
  function statusKey(s) { return String(s || 'Planifié').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]+/g, '-'); }
  function range() {
    var s = parseD(DATA.meta.rangeStart), e = parseD(DATA.meta.rangeEnd);
    DATA.items.forEach(function (it) {
      if (validISO(it.start)) { var a = parseD(it.start); if (a < s) s = a; if (a > e) e = a; }
      if (validISO(it.end)) { var b = parseD(it.end); if (b > e) e = b; }
    });
    return { s: monthStart(s), e: addMonths(monthStart(e), 1) };
  }
  function markDirty() { state.dirty = true; $('dirty').classList.add('on'); }
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  // ---------- Rendu ----------
  var geo = { s: 0, pxDay: 1, axisY: 0 };
  function topPad() { var t = document.querySelector('.top').offsetHeight + 10; $('stage').style.paddingTop = t + 'px'; return t; }
  function render() {
    var PAD = topPad();
    var R = range(); var pxDay = state.zoom / 30.4375;
    var W = (R.e - R.s) / DAY * pxDay;
    var X = function (t) { return (t - R.s) / DAY * pxDay; };
    var cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 210;
    var LSTEP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--level-step')) || 104;
    var LANE = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lane-step')) || 42;
    var CARD_H = 70, GAP = 12;

    var visible = DATA.items.filter(function (it) { return !state.hidden[it.category] && validISO(it.start); });
    // Jalons : cartes réparties de part et d'autre de l'axe, sur des « étagères », avec décalage horizontal pour compacter.
    var ms = visible.filter(function (it) { return it.type === 'jalon'; }).map(function (it) { return { it: it, x: X(parseD(it.start)) }; })
      .sort(function (a, b) { return a.x - b.x; });
    var shelvesUp = [], shelvesDown = [];
    function tryPlace(shelves, m) {
      var minL = Math.max(0, m.x - cw + 18), maxL = Math.max(minL, Math.min(W - cw, m.x - 18));
      var want = Math.min(Math.max(minL, m.x - cw / 2), maxL);
      for (var lv = 0; ; lv++) {
        var left = shelves[lv] == null ? want : Math.max(want, shelves[lv] + GAP);
        if (left <= maxL) return { lv: lv, left: left };
      }
    }
    ms.forEach(function (m) {
      var up = tryPlace(shelvesUp, m), down = tryPlace(shelvesDown, m);
      var below = down.lv < up.lv; var p = below ? down : up;
      m.below = below; m.level = p.lv; m.left = p.left; (below ? shelvesDown : shelvesUp)[p.lv] = p.left + cw;
    });
    // Périodes : barres en couloirs, sous les jalons du bas.
    var bars = visible.filter(function (it) { return it.type !== 'jalon'; }).map(function (it) {
      var a = parseD(it.start), b = validISO(it.end) ? parseD(it.end) : a; if (b < a) b = a;
      var x1 = X(a), x2 = X(b + DAY); var w = Math.max(10, x2 - x1);
      var lab = it.title.length * 7.2 + 150;
      return { it: it, x1: x1, w: w, ext: w > lab ? x1 + w : x1 + w + lab };
    }).sort(function (a, b) { return a.x1 - b.x1; });
    var lanes = [];
    bars.forEach(function (b) { var ln = 0; while (ln < lanes.length && lanes[ln] + GAP > b.x1) ln++; lanes[ln] = b.ext; b.lane = ln; });

    var aboveH = 30 + (shelvesUp.length ? (shelvesUp.length - 1) * LSTEP + CARD_H + 34 : 50);
    var axisY = aboveH;
    var downTop = axisY + 64;
    var barsTop = downTop + (shelvesDown.length ? (shelvesDown.length - 1) * LSTEP + CARD_H + 26 : 0);
    var H = barsTop + Math.max(1, lanes.length) * LANE + 30;
    geo = { s: R.s, pxDay: pxDay, axisY: axisY };

    var h = '';
    // Années et mois
    for (var t = R.s; t < R.e; t = addMonths(t, 1)) {
      var d = new Date(t), m = d.getUTCMonth(), y = d.getUTCFullYear(), x = X(t);
      if (m === 0 || t === R.s) {
        var yEnd = Math.min(R.e, Date.UTC(y + 1, 0, 1));
        h += '<div class="yr-mark" style="left:' + x + 'px;width:' + (X(yEnd) - x) + 'px">' + (m === 0 && t !== R.s ? '<div class="sep"></div>' : '') + '<div class="big" style="left:' + Math.max(0, (X(yEnd) - x) / 2 - 170) + 'px;top:' + Math.max(0, axisY - 190) + 'px">' + y + '</div></div>';
        h += '<div class="ypill" style="left:' + x + 'px;top:' + (axisY + 8) + 'px">' + y + '</div>';
      }
      h += '<div class="mgrid" style="left:' + x + 'px"></div>';
      h += '<div class="tick" style="left:' + x + 'px;top:' + axisY + 'px"></div>';
      h += '<div class="mlabel" style="left:' + (x + (X(addMonths(t, 1)) - x) / 2) + 'px;top:' + (axisY + 30) + 'px">' + MONTHS[m] + '</div>';
    }
    h += '<div class="axis" style="top:' + axisY + 'px;width:' + W + 'px"></div>';
    // Aujourd'hui
    var today = parseD(todayISO());
    if (today >= R.s && today < R.e) h += '<div class="today" style="left:' + X(today) + 'px"><span style="top:' + (axisY - 16) + 'px">Aujourd\'hui · ' + fmtFR(iso(today)) + '</span></div>';
    // Jalons
    var idx = 0;
    ms.forEach(function (m) {
      var it = m.it, c = itemColor(it), sel = state.selected === it.id ? ' selected' : '';
      var top = m.below ? downTop + m.level * LSTEP : axisY - 32 - m.level * LSTEP - CARD_H;
      var stemTop = m.below ? axisY + 8 : top + CARD_H, stemBottom = m.below ? top : axisY + 8;
      h += '<div class="stem" style="left:' + m.x + 'px;top:' + stemTop + 'px;height:' + (stemBottom - stemTop) + 'px;--c:' + c + ';--i:' + idx + '"></div>';
      h += '<div class="dot" data-id="' + esc(it.id) + '" style="left:' + m.x + 'px;top:' + (axisY + 8) + 'px;--c:' + c + ';--i:' + idx + '"></div>';
      h += '<div class="card' + sel + '" data-id="' + esc(it.id) + '" style="left:' + m.left + 'px;top:' + top + 'px;height:' + CARD_H + 'px;--c:' + c + ';--i:' + idx + '">' +
        '<div class="d">' + fmtLong(it.start) + (it.owner ? '<em>· ' + esc(it.owner) + '</em>' : '') + '<span class="st ' + statusKey(it.status) + '">' + esc(it.status || '') + '</span></div>' +
        '<div class="t">' + esc(it.title) + '</div></div>';
      idx++;
    });
    // Périodes
    bars.forEach(function (b) {
      var it = b.it, c = itemColor(it), sel = state.selected === it.id ? ' selected' : '';
      var top = barsTop + b.lane * LANE;
      var label = esc(it.title) + '<small>' + fmtLong(it.start) + ' → ' + fmtLong(it.end || it.start) + '</small>';
      var inside = b.w > it.title.length * 7.2 + 150;
      h += '<div class="bar ' + statusKey(it.status) + sel + '" data-id="' + esc(it.id) + '" style="left:' + b.x1 + 'px;width:' + b.w + 'px;top:' + top + 'px;--c:' + c + ';--i:' + idx + '" title="' + esc(it.title) + ' : ' + fmtFR(it.start) + ' → ' + fmtFR(it.end) + '">' +
        (inside ? '<span class="in">' + label + '</span>' : '<span class="out">' + label + '</span>') + '</div>';
      idx++;
    });
    if (!visible.length) h += '<div class="empty">Aucun projet à afficher. Utilisez « + Ajouter » ou réactivez une catégorie.</div>';
    var cv = $('canvas'); cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.innerHTML = h;
    if (!state.intro) cv.classList.remove('intro');
    state.intro = false;
  }

  function renderLegend() {
    var l = $('legend'); l.innerHTML = '';
    DATA.categories.forEach(function (c) {
      var b = document.createElement('button'); b.className = 'chip' + (state.hidden[c.name] ? ' off' : ''); b.style.setProperty('--c', c.color);
      b.innerHTML = '<i></i>' + esc(c.name); b.title = 'Afficher / masquer';
      b.onclick = function () { state.hidden[c.name] = !state.hidden[c.name]; renderLegend(); render(); };
      l.appendChild(b);
    });
  }
  function renderYears() {
    var R = range(), y = $('years'); y.innerHTML = '';
    for (var yr = new Date(R.s).getUTCFullYear(); yr <= new Date(R.e - DAY).getUTCFullYear(); yr++) {
      (function (yr) { var b = document.createElement('button'); b.textContent = yr; b.onclick = function () { scrollTo(Date.UTC(yr, 0, 1), true); }; y.appendChild(b); })(yr);
    }
  }
  function scrollTo(t, leftAlign) {
    var st = $('stage'); var x = (t - geo.s) / DAY * geo.pxDay + 60;
    st.scrollTo({ left: leftAlign ? x - 40 : x - st.clientWidth / 2, behavior: 'smooth' });
  }

  // ---------- Navigation : glisser, zoom ----------
  var stage = $('stage'), drag = null;
  stage.addEventListener('pointerdown', function (e) { if (e.button !== 0) return; drag = { x: e.clientX, y: e.clientY, sl: stage.scrollLeft, st: stage.scrollTop, moved: false }; });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return; var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 6) { drag.moved = true; stage.classList.add('drag'); }
    if (drag.moved) { stage.scrollLeft = drag.sl - dx; stage.scrollTop = drag.st - dy; }
  });
  function endDrag() { if (drag && drag.moved) { setTimeout(function () { stage.classList.remove('drag'); }, 0); } var moved = drag && drag.moved; drag = null; return moved; }
  stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag); stage.addEventListener('pointerleave', function () { drag = null; stage.classList.remove('drag'); });
  stage.addEventListener('click', function (e) {
    if (stage.classList.contains('drag')) return;
    var el = e.target.closest('[data-id]'); if (el) openDrawer(el.getAttribute('data-id'));
  });
  function zoom(f, cx) {
    var old = state.zoom; state.zoom = Math.max(60, Math.min(420, Math.round(old * f)));
    if (state.zoom === old) return;
    var st = $('stage'); var px = cx == null ? st.clientWidth / 2 : cx; var world = (st.scrollLeft + px - 60) / old;
    render(); st.scrollLeft = world * state.zoom + 60 - px;
  }
  $('z-in').onclick = function () { zoom(1.25); }; $('z-out').onclick = function () { zoom(0.8); };
  stage.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 0.87, e.clientX - stage.getBoundingClientRect().left); }
    else if (!e.shiftKey && Math.abs(e.deltaX) < Math.abs(e.deltaY) && stage.scrollHeight <= stage.clientHeight + 2) { e.preventDefault(); stage.scrollLeft += e.deltaY; }
  }, { passive: false });
  $('go-today').onclick = function () { scrollTo(parseD(todayISO())); };

  // ---------- Panneau d'édition ----------
  var editing = null;
  function openDrawer(id) {
    var it = findItem(id); if (!it) return;
    editing = it; state.selected = id;
    $('d-title').textContent = it.title || 'Projet';
    $('f-title').value = it.title || ''; $('f-start').value = it.start || ''; $('f-end').value = it.end || it.start || '';
    $('f-category').value = it.category || ''; $('f-owner').value = it.owner || ''; $('f-desc').value = it.description || '';
    var st = $('f-status'); st.innerHTML = '';
    DATA.statuses.forEach(function (s) { var o = document.createElement('option'); o.value = s; o.textContent = s; st.appendChild(o); });
    if (it.status && DATA.statuses.indexOf(it.status) < 0) { var o = document.createElement('option'); o.value = it.status; o.textContent = it.status; st.appendChild(o); }
    st.value = it.status || DATA.statuses[0];
    var dl = $('cat-list'); dl.innerHTML = ''; DATA.categories.forEach(function (c) { var o = document.createElement('option'); o.value = c.name; dl.appendChild(o); });
    syncType(); renderColors(); updateDuration();
    $('drawer').classList.add('on'); document.body.classList.add('drawer-open'); render();
  }
  function closeDrawer() { editing = null; state.selected = null; $('drawer').classList.remove('on'); document.body.classList.remove('drawer-open'); render(); }
  function syncType() {
    if (!editing) return; var j = editing.type === 'jalon';
    $('t-jalon').classList.toggle('on', j); $('t-periode').classList.toggle('on', !j);
    $('w-end').style.display = j ? 'none' : ''; $('l-start').textContent = j ? 'Date' : 'Début';
  }
  function renderColors() {
    var box = $('f-colors'); box.innerHTML = ''; var cur = (editing.color || '').toLowerCase();
    var auto = document.createElement('span'); auto.className = 'sw' + (cur ? '' : ' on'); auto.title = 'Couleur de la catégorie';
    auto.style.background = catColor(editing.category); auto.style.borderStyle = 'dashed'; auto.style.borderColor = cur ? 'rgba(255,255,255,.4)' : '#fff';
    auto.onclick = function () { delete editing.color; markDirty(); renderColors(); render(); }; box.appendChild(auto);
    PALETTE.forEach(function (c) {
      var s = document.createElement('span'); s.className = 'sw' + (cur === c ? ' on' : ''); s.style.background = c; s.title = c;
      s.onclick = function () { editing.color = c; markDirty(); renderColors(); render(); }; box.appendChild(s);
    });
    var inp = document.createElement('input'); inp.type = 'color'; inp.value = cur || catColor(editing.category); inp.title = 'Couleur personnalisée';
    inp.oninput = function () { editing.color = inp.value; markDirty(); render(); }; box.appendChild(inp);
  }
  function updateDuration() {
    if (!editing) return; var el = $('f-duration');
    if (editing.type === 'jalon' || !validISO(editing.start) || !validISO(editing.end)) { el.textContent = ''; return; }
    var n = Math.round((parseD(editing.end) - parseD(editing.start)) / DAY) + 1;
    el.textContent = n < 1 ? 'La date de fin est antérieure à la date de début.' : 'Durée : ' + n + ' jour' + (n > 1 ? 's' : '') + ' (' + Math.round(n / 7 * 10) / 10 + ' semaines)';
    el.style.color = n < 1 ? 'var(--danger)' : '';
  }
  function bind(id, prop, after) {
    $(id).addEventListener('input', function () {
      if (!editing) return; editing[prop] = this.value; markDirty(); if (after) after();
      if (prop === 'title') $('d-title').textContent = editing.title || 'Projet';
      render();
    });
  }
  bind('f-title', 'title'); bind('f-owner', 'owner'); bind('f-desc', 'description');
  bind('f-category', 'category', function () { ensureCategory(editing.category); renderColors(); });
  $('f-status').addEventListener('change', function () { if (!editing) return; editing.status = this.value; markDirty(); render(); });
  $('f-start').addEventListener('input', function () {
    if (!editing || !validISO(this.value)) return; editing.start = this.value;
    if (editing.type === 'jalon' || !validISO(editing.end) || parseD(editing.end) < parseD(editing.start)) { editing.end = editing.start; $('f-end').value = editing.end; }
    markDirty(); updateDuration(); renderYears(); render();
  });
  $('f-end').addEventListener('input', function () { if (!editing || !validISO(this.value)) return; editing.end = this.value; markDirty(); updateDuration(); renderYears(); render(); });
  $('t-jalon').onclick = function () { if (!editing) return; editing.type = 'jalon'; editing.end = editing.start; $('f-end').value = editing.end; markDirty(); syncType(); updateDuration(); render(); };
  $('t-periode').onclick = function () {
    if (!editing) return; editing.type = 'periode';
    if (!validISO(editing.end) || parseD(editing.end) <= parseD(editing.start)) { editing.end = iso(parseD(editing.start) + 14 * DAY); $('f-end').value = editing.end; }
    markDirty(); syncType(); updateDuration(); render();
  };
  $('d-close').onclick = closeDrawer; $('d-ok').onclick = closeDrawer;
  $('d-delete').onclick = function () {
    if (!editing) return; if (!confirm('Supprimer « ' + editing.title + ' » ?')) return;
    DATA.items = DATA.items.filter(function (it) { return it.id !== editing.id; }); markDirty(); closeDrawer();
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && editing) closeDrawer(); });

  // ---------- Ajout ----------
  $('btn-add').onclick = function () {
    var start = todayISO(); var R = range(); if (parseD(start) < R.s || parseD(start) >= R.e) start = iso(R.s);
    var cat = DATA.categories[0] ? DATA.categories[0].name : 'Général'; ensureCategory(cat);
    var it = { id: 'p-' + Date.now().toString(36), title: 'Nouveau projet', type: 'jalon', start: start, end: start, category: cat, owner: '', status: DATA.statuses[0], description: '' };
    DATA.items.push(it); state.hidden[cat] = false; renderLegend(); markDirty(); openDrawer(it.id); scrollTo(parseD(start));
    setTimeout(function () { $('f-title').focus(); $('f-title').select(); }, 260);
  };

  // ---------- Enregistrer et générer ----------
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 5000); }
  function savedInfo() { $('saved-info').textContent = DATA.meta.savedAt ? 'Version enregistrée le ' + new Date(DATA.meta.savedAt).toLocaleString('fr-FR') : 'Version initiale (issue du PowerPoint)'; }
  $('btn-save').onclick = function () {
    DATA.meta.savedAt = new Date().toISOString();
    var json = JSON.stringify(DATA, null, 2).replace(/<\//g, '<\\/');
    var re = new RegExp('<script id="retro-data"[^>]*>[\\s\\S]*?<\\/script>');
    var block = '<script id="retro-data" type="application/json">\n' + json + '\n</scr' + 'ipt>';
    if (!re.test(TEMPLATE)) { alert('Impossible de retrouver le bloc de données dans le fichier.'); return; }
    var html = TEMPLATE.replace(re, function () { return block; });
    var d = new Date(); var pad = function (n) { return String(n).padStart(2, '0'); };
    var name = 'retroplanning_expat_' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '_' + pad(d.getHours()) + 'h' + pad(d.getMinutes()) + '.html';
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    state.dirty = false; $('dirty').classList.remove('on'); savedInfo();
    toast('Fichier généré : ' + name + ' (dossier Téléchargements)');
  };
  window.addEventListener('beforeunload', function (e) { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- Init ----------
  document.title = DATA.meta.title || document.title;
  $('app-title').textContent = DATA.meta.title || 'Rétroplanning'; $('app-subtitle').textContent = DATA.meta.subtitle || '';
  savedInfo(); renderLegend(); renderYears(); render();
  // Centre la vue sur aujourd'hui (ou sur le premier projet).
  var t0 = parseD(todayISO()); var R0 = range();
  if (t0 < R0.s || t0 >= R0.e) { var first = DATA.items.map(function (i) { return i.start; }).filter(validISO).sort()[0]; if (first) t0 = parseD(first); }
  stage.scrollLeft = (t0 - geo.s) / DAY * geo.pxDay + 60 - stage.clientWidth / 2;
  stage.scrollTop = Math.max(0, geo.axisY + topPad() - stage.clientHeight / 2);
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 120); });
})();
</script>
</body>
</html>
