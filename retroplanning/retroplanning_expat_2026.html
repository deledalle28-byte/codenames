<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rétroplanning Expat</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f6f8fb; --ink:#0f1f3d; --muted:#6b7590; --line:#e3e8f0; --line2:#eef1f6;
    --navy:#0f1f3d; --accent:#1f4e9c; --danger:#c62828; --today:#e5484d;
    --card-w:196px; --level-step:86px; --lane-step:36px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Inter,-apple-system,Roboto,Helvetica,Arial,sans-serif;min-height:100vh}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  ::-webkit-scrollbar{height:10px;width:10px}
  ::-webkit-scrollbar-thumb{background:#c9d1de;border-radius:10px;border:2px solid #fff}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- Barre du haut ---------- */
  .top{position:sticky;top:0;z-index:30;display:flex;flex-direction:column;gap:8px;padding:12px 24px 10px;background:#fff;border-bottom:1px solid var(--line);
    box-shadow:0 4px 20px rgba(15,31,61,.06);transition:padding-right .25s cubic-bezier(.2,.8,.2,1)}
  body.drawer-open .top{padding-right:444px}
  .top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.2px;color:var(--navy)}
  .brand small{display:block;color:var(--muted);font-size:12px}
  .legend{display:flex;gap:6px;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600;color:#334;transition:.15s}
  .chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
  .chip:hover{background:var(--bg2)}
  .chip.off{opacity:.4;text-decoration:line-through}
  .spacer{flex:1}
  .ctl{display:flex;align-items:center;gap:6px}
  .btn{border:1px solid var(--line);background:#fff;padding:8px 13px;border-radius:9px;font-weight:600;color:var(--ink);transition:.15s;white-space:nowrap}
  .btn:hover{background:var(--bg2);border-color:#cfd7e3}
  .btn.icon{padding:8px 11px;min-width:36px;text-align:center}
  .btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(15,31,61,.25)}
  .btn.primary:hover{background:#1a3466}
  .btn.danger{color:var(--danger);border-color:#f1c8c8}
  .btn.danger:hover{background:#fdecec}
  .years{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .years button{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted)}
  .years button:hover{color:var(--navy);background:#e9eef6}
  .dirty{display:none;align-items:center;gap:6px;color:#b26a00;font-weight:600;font-size:12px}
  .dirty.on{display:inline-flex}
  .dirty::before{content:"";width:7px;height:7px;border-radius:50%;background:#f0a300}
  .saved{color:var(--muted);font-size:11.5px;white-space:nowrap}

  /* ---------- Navigateur (mini-carte) ---------- */
  .nav{display:flex;align-items:center;gap:10px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);transition:padding-right .25s}
  body.drawer-open .nav{padding-right:444px}
  .arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;line-height:1;color:var(--navy);flex:0 0 38px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .arrow:hover{background:var(--bg2);border-color:#cfd7e3}
  .arrow[disabled]{opacity:.3;cursor:default}
  .minimap{flex:1;height:46px;position:relative;background:#f3f5f9;border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;user-select:none;touch-action:none}
  .mm-year{position:absolute;top:0;bottom:0;border-left:1px solid #d5dce8;padding:3px 7px;font-size:10px;font-weight:800;color:#7d879e;letter-spacing:.6px;white-space:nowrap}
  .mm-year:first-child{border-left:0}
  .mm-dot{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--c);transform:translateX(-50%)}
  .mm-bar{position:absolute;height:3px;border-radius:2px;background:var(--c);opacity:.85}
  .mm-win{position:absolute;top:0;bottom:0;background:rgba(31,78,156,.10);border:2px solid var(--navy);border-radius:7px;cursor:grab;box-shadow:0 0 0 1px #fff inset}
  .mm-win:active{cursor:grabbing}

  /* ---------- Scène ---------- */
  .wrap{position:relative}
  .stage{position:relative;overflow-x:auto;overflow-y:hidden;cursor:grab;background:#fff;scrollbar-width:thin}
  .stage.drag{cursor:grabbing;user-select:none}
  .edge{position:absolute;top:50%;transform:translateY(-50%);z-index:9;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.95);
    box-shadow:0 6px 18px rgba(15,31,61,.14);font-size:24px;line-height:1;color:var(--navy);display:flex;align-items:center;justify-content:center;transition:.15s}
  .edge:hover{background:#fff;transform:translateY(-50%) scale(1.06)}
  .edge[disabled]{opacity:0;pointer-events:none}
  .edge.l{left:14px}.edge.r{right:14px}
  .canvas{position:relative;margin:0 60px}
  .yr-mark{position:absolute;top:0;bottom:0;pointer-events:none}
  .yr-mark .sep{position:absolute;left:0;top:0;bottom:0;border-left:2px dashed #c9d1de}
  .mgrid{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2);pointer-events:none}

  /* axe */
  .axis{position:absolute;left:0;right:0;height:10px;border-radius:999px;background:linear-gradient(90deg,#0f1f3d,#1f4e9c 40%,#0e8a8a 70%,#0f1f3d);box-shadow:0 4px 14px rgba(15,31,61,.25)}
  .tick{position:absolute;width:1px;height:18px;background:#b8c2d3;transform:translateY(-4px)}
  .mlabel{position:absolute;font-size:10.5px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#7d879e;white-space:nowrap;transform:translateX(-50%)}
  .ypill{position:absolute;transform:translate(-50%,-50%);background:var(--navy);color:#fff;font-weight:800;font-size:12px;padding:4px 12px;border-radius:999px;letter-spacing:1px;box-shadow:0 4px 12px rgba(15,31,61,.3);z-index:4}
  .today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--today);z-index:1;pointer-events:none;opacity:.85}
  .today span{position:absolute;left:50%;transform:translate(-50%,-50%);z-index:7;background:var(--today);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.3px;box-shadow:0 4px 12px rgba(229,72,77,.35)}

  /* jalons */
  .stem{position:absolute;width:1px;background:#b8c2d3;pointer-events:none}
  .dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 2px var(--c),0 2px 6px rgba(0,0,0,.2);transform:translate(-50%,-50%);z-index:5;cursor:pointer;transition:transform .15s}
  .dot:hover{transform:translate(-50%,-50%) scale(1.3)}
  .card{position:absolute;width:var(--card-w);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 13px;cursor:pointer;
    box-shadow:0 3px 10px rgba(15,31,61,.06);transition:transform .18s,box-shadow .18s,border-color .18s;z-index:2}
  .card::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--c)}
  .card:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 14px 30px rgba(15,31,61,.16);z-index:6}
  .card .d{font-size:10.5px;font-weight:800;color:var(--c);letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .card .d em{font-style:normal;color:var(--muted);font-weight:600;text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .card .t{font-weight:700;font-size:12.5px;line-height:1.25;margin-top:3px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .st{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:#eef1f6;color:#4a5573;margin-left:auto;letter-spacing:.2px;text-transform:none;flex:0 0 auto}
  .card .st.planifie{display:none}
  .st.termine{background:#e3f6ea;color:#1f7a3e}
  .st.en-cours{background:#e6eefb;color:#1f4e9c}
  .st.en-retard{background:#fdeaea;color:#b71c1c}
  .st.annule{background:#eef1f6;color:#8a93a8;text-decoration:line-through}
  .selected.card,.selected.bar{outline:2px solid var(--navy);outline-offset:2px}

  /* périodes : rubans sous l'axe */
  .bar{position:absolute;height:24px;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 10px;cursor:pointer;font-weight:700;font-size:11.5px;white-space:nowrap;
    background:color-mix(in srgb,var(--c) 13%,#fff);border:1px solid color-mix(in srgb,var(--c) 45%,#fff);color:color-mix(in srgb,var(--c) 85%,#000);
    transition:transform .15s,box-shadow .15s;z-index:2;overflow:visible}
  .bar::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:0 0 6px}
  .bar:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,31,61,.14);z-index:6;background:color-mix(in srgb,var(--c) 20%,#fff)}
  .bar .in{overflow:hidden;text-overflow:ellipsis}
  .bar .in small{opacity:.75;font-weight:600;margin-left:6px}
  .bar .out{position:absolute;left:100%;margin-left:8px;color:color-mix(in srgb,var(--c) 85%,#000);font-weight:700;overflow:hidden;text-overflow:ellipsis}
  .bar .out small{margin-left:6px;opacity:.7;font-weight:600}
  .mk{position:absolute;top:0;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--c);transform:translate(-50%,-50%);z-index:3;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  .mk:hover{transform:translate(-50%,-50%) scale(1.25);z-index:8}
  .mk::after{content:attr(data-tip);position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);background:var(--navy);color:#fff;font-size:11px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;box-shadow:0 6px 16px rgba(15,31,61,.25)}
  .mk::before{content:"";position:absolute;left:50%;bottom:100%;transform:translate(-50%,0);border:5px solid transparent;border-top-color:var(--navy);opacity:0;transition:opacity .12s}
  .mk:hover::after,.mk:hover::before{opacity:1}
  .bar.termine{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,#fff) 0 6px,transparent 6px 12px)}
  .bar.annule{opacity:.45}
  .empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--muted)}

  .intro .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*22ms)}
  .intro .bar{animation:grow .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*22ms + 150ms);transform-origin:left center}
  .intro .dot,.intro .stem{animation:fade .5s both;animation-delay:calc(var(--i)*22ms)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes grow{from{opacity:0;transform:scaleX(.3)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ---------- Panneau ---------- */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100vw;z-index:50;background:#fff;border-left:1px solid var(--line);box-shadow:-16px 0 40px rgba(15,31,61,.12);
    transform:translateX(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .drawer header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
  .drawer h2{margin:0;font-size:15px;font-weight:800;color:var(--navy)}
  .drawer .body{padding:18px 20px;overflow-y:auto;flex:1}
  .drawer footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .x{border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:8px}
  .x:hover{background:var(--bg2);color:var(--ink)}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.6px;text-transform:uppercase}
  .field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid #cfd7e3;border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid rgba(31,78,156,.3);border-color:var(--accent)}
  .field textarea{min-height:100px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;border:1px solid #cfd7e3;border-radius:9px;overflow:hidden}
  .seg button{flex:1;border:0;background:#fff;padding:9px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--navy);color:#fff}
  .colors{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .sw{width:26px;height:26px;border-radius:8px;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.08) inset}
  .sw.on{border-color:var(--navy)}
  .colors input[type=color]{width:36px;height:30px;border:1px solid #cfd7e3;border-radius:8px;padding:2px;background:#fff}
  .meta{font-size:12px;color:var(--muted);margin:-6px 0 12px}
  .sub{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:13px;background:var(--bg2)}
  .sub h3{margin:0 0 8px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
  .sub .mrow{display:grid;grid-template-columns:118px 1fr 28px;gap:6px;margin-bottom:6px;align-items:center}
  .sub .mrow input{border:1px solid #cfd7e3;border-radius:7px;padding:6px 8px;background:#fff;font-size:12.5px;min-width:0}
  .sub .mrow .del{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;border-radius:6px;padding:2px}
  .sub .mrow .del:hover{background:#fdecec;color:var(--danger)}
  .sub .none{font-size:12px;color:var(--muted);margin:0 0 8px}
  .link{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;font-size:12px;text-decoration:underline;cursor:pointer}
  .crow{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}
  .crow input[type=color]{width:34px;height:30px;border:1px solid #cfd7e3;border-radius:8px;padding:2px;background:#fff}
  .crow input[type=text]{border:1px solid #cfd7e3;border-radius:8px;padding:7px 9px;background:#fff;min-width:0}
  .crow .acts{display:flex;gap:2px}
  .crow .acts button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;padding:4px 6px;font-size:13px;line-height:1}
  .crow .acts button:hover{background:var(--bg2);color:var(--ink);border-color:var(--line)}
  .crow .acts button.del:hover{background:#fdecec;color:var(--danger)}
  .crow small{grid-column:2;color:var(--muted);font-size:11px;margin-top:-2px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:all .25s;z-index:60;font-weight:600;font-size:13px;box-shadow:0 10px 30px rgba(15,31,61,.3);max-width:92vw}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    :root{--card-w:170px;--level-step:96px}
    .top{padding:10px 14px;gap:8px}
    .brand h1{font-size:17px}
    .brand small{display:none}
    .years,.saved{display:none}
    .nav{padding:8px 14px}
    body.drawer-open .nav{padding-right:14px}
    .edge{width:36px;height:36px}
    body.drawer-open .top{padding-right:14px}
    .canvas{margin:0 16px}
  }
  @media print{.top .btn,.top .ctl,.years,.dirty,.nav,.edge,.drawer{display:none!important}.stage{overflow:visible}}
</style>
</head>

<script>
(function () {
  // Copie du document d'origine, capturée avant tout rendu : gabarit pour « Enregistrer et générer ».
  var TEMPLATE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var DATA = JSON.parse(document.getElementById('retro-data').textContent);
  var state = { selected: null, dirty: false, hidden: {}, zoom: 175, intro: true };
  var DAY = 86400000, MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  var MSHORT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  var PALETTE = ['#1f4e9c','#0e8a8a','#2f8f4e','#c98a00','#b23a6f','#d9662a','#6a4fb3','#c62828','#3b7dd8','#5c6b8a','#8a3fa0','#1c8c6e'];
  var $ = function (id) { return document.getElementById(id); };

  // ---------- Dates ----------
  function parseD(s) { var p = String(s).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function iso(t) { return new Date(t).toISOString().slice(0, 10); }
  function validISO(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s || '') && !isNaN(parseD(s)); }
  function fmtFR(s) { if (!validISO(s)) return ''; var p = s.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function fmtLong(s) { if (!validISO(s)) return ''; var d = new Date(parseD(s)); return d.getUTCDate() + ' ' + MSHORT[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
  function monthStart(t) { var d = new Date(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); }
  function addMonths(t, n) { var d = new Date(t); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + n, 1); }
  function todayISO() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  // ---------- Modèle ----------
  function findItem(id) { for (var i = 0; i < DATA.items.length; i++) if (DATA.items[i].id === id) return DATA.items[i]; return null; }
  function catColor(name) {
    for (var i = 0; i < DATA.categories.length; i++) if (DATA.categories[i].name === name) return DATA.categories[i].color;
    return '#5c6b8a';
  }
  function ensureCategory(name) {
    if (!name) return;
    for (var i = 0; i < DATA.categories.length; i++) if (DATA.categories[i].name === name) return;
    DATA.categories.push({ name: name, color: PALETTE[DATA.categories.length % PALETTE.length] });
    renderLegend();
  }
  function itemColor(it) { return it.color || catColor(it.category); }
  function statusKey(s) { return String(s || 'Planifié').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]+/g, '-'); }
  function range() {
    var s = parseD(DATA.meta.rangeStart), e = parseD(DATA.meta.rangeEnd);
    DATA.items.forEach(function (it) {
      if (validISO(it.start)) { var a = parseD(it.start); if (a < s) s = a; if (a > e) e = a; }
      if (validISO(it.end)) { var b = parseD(it.end); if (b > e) e = b; }
    });
    return { s: monthStart(s), e: addMonths(monthStart(e), 1) };
  }
  function markDirty() { state.dirty = true; $('dirty').classList.add('on'); }
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  // ---------- Rendu ----------
  var geo = { s: 0, pxDay: 1, axisY: 0 };
  function render() {
    var R = range(); var pxDay = state.zoom / 30.4375;
    var W = (R.e - R.s) / DAY * pxDay;
    var X = function (t) { return (t - R.s) / DAY * pxDay; };
    var cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 210;
    var LSTEP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--level-step')) || 104;
    var LANE = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--lane-step')) || 42;
    var CARD_H = 70, GAP = 12;

    var visible = DATA.items.filter(function (it) { return !state.hidden[it.category] && validISO(it.start); });
    // Jalons : cartes réparties de part et d'autre de l'axe, sur des « étagères », avec décalage horizontal pour compacter.
    var ms = visible.filter(function (it) { return it.type === 'jalon'; }).map(function (it) { return { it: it, x: X(parseD(it.start)) }; })
      .sort(function (a, b) { return a.x - b.x; });
    var shelvesUp = [], shelvesDown = [];
    function tryPlace(shelves, m) {
      var minL = Math.max(0, m.x - cw + 18), maxL = Math.max(minL, Math.min(W - cw, m.x - 18));
      var want = Math.min(Math.max(minL, m.x - cw / 2), maxL);
      for (var lv = 0; ; lv++) {
        var left = shelves[lv] == null ? want : Math.max(want, shelves[lv] + GAP);
        if (left <= maxL) return { lv: lv, left: left };
      }
    }
    ms.forEach(function (m) {
      var up = tryPlace(shelvesUp, m), down = tryPlace(shelvesDown, m);
      var below = down.lv < up.lv; var p = below ? down : up;
      m.below = below; m.level = p.lv; m.left = p.left; (below ? shelvesDown : shelvesUp)[p.lv] = p.left + cw;
    });
    // Périodes : barres en couloirs, sous les jalons du bas.
    var bars = visible.filter(function (it) { return it.type !== 'jalon'; }).map(function (it) {
      var a = parseD(it.start), b = validISO(it.end) ? parseD(it.end) : a; if (b < a) b = a;
      var x1 = X(a), x2 = X(b + DAY); var w = Math.max(10, x2 - x1);
      var lab = it.title.length * 6.8 + 140;
      return { it: it, x1: x1, w: w, ext: w > lab ? x1 + w : x1 + w + lab };
    }).sort(function (a, b) { return a.x1 - b.x1; });
    var lanes = [];
    bars.forEach(function (b) { var ln = 0; while (ln < lanes.length && lanes[ln] + GAP > b.x1) ln++; lanes[ln] = b.ext; b.lane = ln; });

    var aboveH = 30 + (shelvesUp.length ? (shelvesUp.length - 1) * LSTEP + CARD_H + 34 : 50);
    var axisY = aboveH;
    var barsTop = axisY + 50;
    var downTop = barsTop + lanes.length * LANE + (lanes.length ? 22 : 8);
    var H = downTop + (shelvesDown.length ? (shelvesDown.length - 1) * LSTEP + CARD_H : 0) + 26;
    geo = { s: R.s, pxDay: pxDay, axisY: axisY };

    var h = '';
    // Années et mois
    for (var t = R.s; t < R.e; t = addMonths(t, 1)) {
      var d = new Date(t), m = d.getUTCMonth(), y = d.getUTCFullYear(), x = X(t);
      if (m === 0 || t === R.s) {
        var yEnd = Math.min(R.e, Date.UTC(y + 1, 0, 1));
        h += '<div class="yr-mark" style="left:' + x + 'px;width:' + (X(yEnd) - x) + 'px">' + (m === 0 && t !== R.s ? '<div class="sep"></div>' : '') + '</div>';
        h += '<div class="ypill" style="left:' + x + 'px;top:' + (axisY + 5) + 'px">' + y + '</div>';
      }
      h += '<div class="mgrid" style="left:' + x + 'px"></div>';
      h += '<div class="tick" style="left:' + x + 'px;top:' + axisY + 'px"></div>';
      h += '<div class="mlabel" style="left:' + (x + (X(addMonths(t, 1)) - x) / 2) + 'px;top:' + (axisY + 22) + 'px">' + MONTHS[m] + '</div>';
    }
    h += '<div class="axis" style="top:' + axisY + 'px;width:' + W + 'px"></div>';
    // Aujourd'hui
    var today = parseD(todayISO());
    if (today >= R.s && today < R.e) h += '<div class="today" style="left:' + X(today) + 'px"><span style="top:' + (axisY - 16) + 'px">Aujourd\'hui · ' + fmtFR(iso(today)) + '</span></div>';
    // Jalons
    var idx = 0;
    ms.forEach(function (m) {
      var it = m.it, c = itemColor(it), sel = state.selected === it.id ? ' selected' : '';
      var top = m.below ? downTop + m.level * LSTEP : axisY - 30 - m.level * LSTEP - CARD_H;
      var stemTop = m.below ? axisY + 5 : top + CARD_H, stemBottom = m.below ? top : axisY + 5;
      h += '<div class="stem" style="left:' + m.x + 'px;top:' + stemTop + 'px;height:' + (stemBottom - stemTop) + 'px;--c:' + c + ';--i:' + idx + '"></div>';
      h += '<div class="dot" data-id="' + esc(it.id) + '" style="left:' + m.x + 'px;top:' + (axisY + 5) + 'px;--c:' + c + ';--i:' + idx + '"></div>';
      h += '<div class="card' + sel + '" data-id="' + esc(it.id) + '" style="left:' + m.left + 'px;top:' + top + 'px;height:' + CARD_H + 'px;--c:' + c + ';--i:' + idx + '">' +
        '<div class="d">' + fmtLong(it.start) + (it.owner ? '<em>· ' + esc(it.owner) + '</em>' : '') + '<span class="st ' + statusKey(it.status) + '">' + esc(it.status || '') + '</span></div>' +
        '<div class="t">' + esc(it.title) + '</div></div>';
      idx++;
    });
    // Périodes
    bars.forEach(function (b) {
      var it = b.it, c = itemColor(it), sel = state.selected === it.id ? ' selected' : '';
      var top = barsTop + b.lane * LANE;
      var label = esc(it.title) + '<small>' + fmtLong(it.start) + ' → ' + fmtLong(it.end || it.start) + '</small>';
      var inside = b.w > it.title.length * 6.8 + 140;
      var mks = '';
      (it.milestones || []).forEach(function (mk) {
        if (!validISO(mk.date)) return;
        mks += '<span class="mk" data-mk="' + esc(mk.id) + '" data-tip="' + esc(mk.title || 'Jalon') + ' · ' + fmtLong(mk.date) + '" style="left:' + (X(parseD(mk.date)) - b.x1) + 'px"></span>';
      });
      h += '<div class="bar ' + statusKey(it.status) + sel + '" data-id="' + esc(it.id) + '" style="left:' + b.x1 + 'px;width:' + b.w + 'px;top:' + top + 'px;--c:' + c + ';--i:' + idx + '" title="' + esc(it.title) + ' : ' + fmtFR(it.start) + ' → ' + fmtFR(it.end) + '">' +
        (inside ? '<span class="in">' + label + '</span>' : '<span class="out">' + label + '</span>') + mks + '</div>';
      idx++;
    });
    if (!visible.length) h += '<div class="empty">Aucun projet à afficher. Utilisez « + Ajouter » ou réactivez une catégorie.</div>';
    var cv = $('canvas'); cv.style.width = W + 'px'; cv.style.height = H + 'px'; cv.innerHTML = h;
    $('stage').style.height = (H + 12) + 'px';
    if (!state.intro) cv.classList.remove('intro');
    state.intro = false;
    geo.W = W; geo.R = R;
    renderMinimap(); syncNav();
  }

  // ---------- Mini-carte et flèches ----------
  function renderMinimap() {
    var mm = $('minimap'), R = geo.R, total = R.e - R.s, mw = mm.clientWidth; if (!mw) return;
    var P = function (t) { return (t - R.s) / total * mw; };
    var h = '';
    for (var t = R.s; t < R.e; t = addMonths(t, 12)) { var y = new Date(t).getUTCFullYear(); var e = Math.min(R.e, Date.UTC(y + 1, 0, 1)); h += '<div class="mm-year" style="left:' + P(t) + 'px;width:' + (P(e) - P(t)) + 'px">' + y + '</div>'; }
    var lane = 0;
    DATA.items.forEach(function (it) {
      if (state.hidden[it.category] || !validISO(it.start)) return; var c = itemColor(it);
      if (it.type === 'jalon') h += '<div class="mm-dot" style="left:' + P(parseD(it.start)) + 'px;top:' + (18 + (lane++ % 3) * 6) + 'px;--c:' + c + '"></div>';
      else {
        var a = P(parseD(it.start)), b = P(parseD(validISO(it.end) ? it.end : it.start) + DAY); h += '<div class="mm-bar" style="left:' + a + 'px;width:' + Math.max(2, b - a) + 'px;top:' + (37 + (lane++ % 2) * 4) + 'px;--c:' + c + '"></div>';
        (it.milestones || []).forEach(function (mk) { if (validISO(mk.date)) h += '<div class="mm-dot" style="left:' + P(parseD(mk.date)) + 'px;top:' + (18 + (lane++ % 3) * 6) + 'px;--c:' + c + '"></div>'; });
      }
    });
    h += '<div class="mm-win" id="mm-win"></div>';
    mm.innerHTML = h;
  }
  function syncNav() {
    var st = $('stage'), win = $('mm-win'); if (!win) return;
    var mw = $('minimap').clientWidth, full = st.scrollWidth, vis = st.clientWidth;
    win.style.left = Math.max(0, st.scrollLeft / full * mw) + 'px'; win.style.width = Math.max(24, vis / full * mw) + 'px';
    var atStart = st.scrollLeft <= 2, atEnd = st.scrollLeft + vis >= full - 2;
    ['nav-l', 'edge-l'].forEach(function (id) { $(id).disabled = atStart; }); ['nav-r', 'edge-r'].forEach(function (id) { $(id).disabled = atEnd; });
  }
  function page(dir) { var st = $('stage'); st.scrollBy({ left: dir * st.clientWidth * 0.75, behavior: 'smooth' }); }
  ['nav-l', 'edge-l'].forEach(function (id) { $(id).onclick = function () { page(-1); }; });
  ['nav-r', 'edge-r'].forEach(function (id) { $(id).onclick = function () { page(1); }; });
  (function () {
    var mm = $('minimap'), st = $('stage'), on = false;
    function go(e) { var r = mm.getBoundingClientRect(); var ratio = (e.clientX - r.left) / r.width; st.scrollLeft = ratio * st.scrollWidth - st.clientWidth / 2; }
    mm.addEventListener('pointerdown', function (e) { on = true; mm.setPointerCapture(e.pointerId); go(e); });
    mm.addEventListener('pointermove', function (e) { if (on) go(e); });
    mm.addEventListener('pointerup', function () { on = false; }); mm.addEventListener('pointercancel', function () { on = false; });
  })();
  $('stage').addEventListener('scroll', syncNav);
  document.addEventListener('keydown', function (e) {
    var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); page(-1); } if (e.key === 'ArrowRight') { e.preventDefault(); page(1); }
  });

  function renderLegend() {
    var l = $('legend'); l.innerHTML = '';
    DATA.categories.forEach(function (c) {
      var b = document.createElement('button'); b.className = 'chip' + (state.hidden[c.name] ? ' off' : ''); b.style.setProperty('--c', c.color);
      b.innerHTML = '<i></i>' + esc(c.name); b.title = 'Afficher / masquer';
      b.onclick = function () { state.hidden[c.name] = !state.hidden[c.name]; renderLegend(); render(); };
      l.appendChild(b);
    });
  }
  function renderYears() {
    var R = range(), y = $('years'); y.innerHTML = '';
    for (var yr = new Date(R.s).getUTCFullYear(); yr <= new Date(R.e - DAY).getUTCFullYear(); yr++) {
      (function (yr) { var b = document.createElement('button'); b.textContent = yr; b.onclick = function () { scrollTo(Date.UTC(yr, 0, 1), true); }; y.appendChild(b); })(yr);
    }
  }
  function scrollTo(t, leftAlign) {
    var st = $('stage'); var x = (t - geo.s) / DAY * geo.pxDay + 60;
    st.scrollTo({ left: leftAlign ? x - 40 : x - st.clientWidth / 2, behavior: 'smooth' });
  }

  // ---------- Navigation : glisser, zoom ----------
  var stage = $('stage'), drag = null;
  stage.addEventListener('pointerdown', function (e) { if (e.button !== 0) return; drag = { x: e.clientX, sl: stage.scrollLeft, moved: false }; });
  stage.addEventListener('pointermove', function (e) {
    if (!drag) return; var dx = e.clientX - drag.x;
    if (!drag.moved && Math.abs(dx) > 6) { drag.moved = true; stage.classList.add('drag'); }
    if (drag.moved) stage.scrollLeft = drag.sl - dx;
  });
  function endDrag() { if (drag && drag.moved) { setTimeout(function () { stage.classList.remove('drag'); }, 0); } var moved = drag && drag.moved; drag = null; return moved; }
  stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag); stage.addEventListener('pointerleave', function () { drag = null; stage.classList.remove('drag'); });
  stage.addEventListener('click', function (e) {
    if (stage.classList.contains('drag')) return;
    var el = e.target.closest('[data-id]'); if (el) openDrawer(el.getAttribute('data-id'));
  });
  function zoom(f, cx) {
    var old = state.zoom; state.zoom = Math.max(60, Math.min(420, Math.round(old * f)));
    if (state.zoom === old) return;
    var st = $('stage'); var px = cx == null ? st.clientWidth / 2 : cx; var world = (st.scrollLeft + px - 60) / old;
    render(); st.scrollLeft = world * state.zoom + 60 - px;
  }
  $('z-in').onclick = function () { zoom(1.25); }; $('z-out').onclick = function () { zoom(0.8); };
  stage.addEventListener('wheel', function (e) {
    if (e.ctrlKey || e.metaKey) { e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 0.87, e.clientX - stage.getBoundingClientRect().left); }
    else if (!e.shiftKey && Math.abs(e.deltaX) < Math.abs(e.deltaY) && document.documentElement.scrollHeight <= window.innerHeight + 40) { e.preventDefault(); stage.scrollLeft += e.deltaY; }
  }, { passive: false });
  $('go-today').onclick = function () { scrollTo(parseD(todayISO())); };

  // ---------- Panneau d'édition ----------
  var editing = null;
  function openDrawer(id) {
    var it = findItem(id); if (!it) return;
    editing = it; state.selected = id;
    $('d-title').textContent = it.title || 'Projet';
    $('f-title').value = it.title || ''; $('f-start').value = it.start || ''; $('f-end').value = it.end || it.start || '';
    $('f-category').value = it.category || ''; $('f-owner').value = it.owner || ''; $('f-desc').value = it.description || '';
    var st = $('f-status'); st.innerHTML = '';
    DATA.statuses.forEach(function (s) { var o = document.createElement('option'); o.value = s; o.textContent = s; st.appendChild(o); });
    if (it.status && DATA.statuses.indexOf(it.status) < 0) { var o = document.createElement('option'); o.value = it.status; o.textContent = it.status; st.appendChild(o); }
    st.value = it.status || DATA.statuses[0];
    fillCategorySelect(it.category);
    syncType(); renderColors(); updateDuration(); renderMilestoneList();
    closeCats(true);
    $('drawer').classList.add('on'); document.body.classList.add('drawer-open'); render();
  }
  function closeDrawer() { editing = null; state.selected = null; $('drawer').classList.remove('on'); document.body.classList.remove('drawer-open'); render(); }
  function fillCategorySelect(cur) {
    var sel = $('f-category'); sel.innerHTML = '';
    DATA.categories.forEach(function (c) { var o = document.createElement('option'); o.value = c.name; o.textContent = c.name; sel.appendChild(o); });
    if (cur && !DATA.categories.some(function (c) { return c.name === cur; })) { var o = document.createElement('option'); o.value = cur; o.textContent = cur + ' (inconnue)'; sel.appendChild(o); }
    sel.value = cur || (DATA.categories[0] ? DATA.categories[0].name : '');
  }
  // Jalons rattachés à une période
  function renderMilestoneList() {
    if (!editing) return;
    var box = $('w-ms'); box.style.display = editing.type === 'jalon' ? 'none' : '';
    var list = $('ms-list'); list.innerHTML = '';
    var ms = editing.milestones || [];
    if (!ms.length) { list.innerHTML = '<p class="none">Aucun jalon. Ils s\'affichent comme des repères sur le ruban (nom et date au survol).</p>'; return; }
    ms.slice().sort(function (a, b) { return (a.date || '').localeCompare(b.date || ''); }).forEach(function (mk) {
      var row = document.createElement('div'); row.className = 'mrow';
      var d = document.createElement('input'); d.type = 'date'; d.value = mk.date || '';
      var t = document.createElement('input'); t.type = 'text'; t.value = mk.title || ''; t.placeholder = 'Nom du jalon';
      var x = document.createElement('button'); x.type = 'button'; x.className = 'del'; x.title = 'Supprimer'; x.textContent = '×';
      d.oninput = function () { if (validISO(d.value)) { mk.date = d.value; markDirty(); render(); } };
      t.oninput = function () { mk.title = t.value; markDirty(); render(); };
      x.onclick = function () { editing.milestones = editing.milestones.filter(function (o) { return o !== mk; }); markDirty(); renderMilestoneList(); render(); };
      row.appendChild(d); row.appendChild(t); row.appendChild(x); list.appendChild(row);
    });
  }
  $('ms-add').onclick = function () {
    if (!editing) return; editing.milestones = editing.milestones || [];
    var base = validISO(editing.start) ? parseD(editing.start) : parseD(todayISO()); var end = validISO(editing.end) ? parseD(editing.end) : base;
    editing.milestones.push({ id: 'm-' + Date.now().toString(36), title: 'Nouveau jalon', date: iso(Math.round((base + end) / 2 / DAY) * DAY), description: '' });
    markDirty(); renderMilestoneList(); render();
    var inputs = $('ms-list').querySelectorAll('input[type=text]'); if (inputs.length) { var last = inputs[inputs.length - 1]; last.focus(); last.select(); }
  };
  function syncType() {
    if (!editing) return; var j = editing.type === 'jalon';
    $('t-jalon').classList.toggle('on', j); $('t-periode').classList.toggle('on', !j);
    $('w-end').style.display = j ? 'none' : ''; $('l-start').textContent = j ? 'Date' : 'Début';
  }
  function renderColors() {
    var box = $('f-colors'); box.innerHTML = ''; var cur = (editing.color || '').toLowerCase();
    var auto = document.createElement('span'); auto.className = 'sw' + (cur ? '' : ' on'); auto.title = 'Couleur de la catégorie';
    auto.style.background = catColor(editing.category); auto.style.borderStyle = 'dashed'; auto.style.borderColor = cur ? 'rgba(255,255,255,.4)' : '#fff';
    auto.onclick = function () { delete editing.color; markDirty(); renderColors(); render(); }; box.appendChild(auto);
    PALETTE.forEach(function (c) {
      var s = document.createElement('span'); s.className = 'sw' + (cur === c ? ' on' : ''); s.style.background = c; s.title = c;
      s.onclick = function () { editing.color = c; markDirty(); renderColors(); render(); }; box.appendChild(s);
    });
    var inp = document.createElement('input'); inp.type = 'color'; inp.value = cur || catColor(editing.category); inp.title = 'Couleur personnalisée';
    inp.oninput = function () { editing.color = inp.value; markDirty(); render(); }; box.appendChild(inp);
  }
  function updateDuration() {

    var n = Math.round((parseD(editing.end) - parseD(editing.start)) / DAY) + 1;
    el.textContent = n < 1 ? 'La date de fin est antérieure à la date de début.' : 'Durée : ' + n + ' jour' + (n > 1 ? 's' : '') + ' (' + Math.round(n / 7 * 10) / 10 + ' semaines)';
    el.style.color = n < 1 ? 'var(--danger)' : '';
  }
  function bind(id, prop, after) {
    $(id).addEventListener('input', function () {
      if (!editing) return; editing[prop] = this.value; markDirty(); if (after) after();
      if (prop === 'title') $('d-title').textContent = editing.title || 'Projet';
      render();
    });
  }
  bind('f-title', 'title'); bind('f-owner', 'owner'); bind('f-desc', 'description');
  $('f-category').addEventListener('change', function () { if (!editing) return; editing.category = this.value; markDirty(); renderColors(); renderMinimap(); render(); });
  $('f-cats-open').onclick = function () { openCats(); };
  $('f-status').addEventListener('change', function () { if (!editing) return; editing.status = this.value; markDirty(); render(); });
  $('f-start').addEventListener('input', function () {
    if (!editing || !validISO(this.value)) return; editing.start = this.value;
    if (editing.type === 'jalon' || !validISO(editing.end) || parseD(editing.end) < parseD(editing.start)) { editing.end = editing.start; $('f-end').value = editing.end; }
    markDirty(); updateDuration(); renderYears(); render();
  });
  $('f-end').addEventListener('input', function () { if (!editing || !validISO(this.value)) return; editing.end = this.value; markDirty(); updateDuration(); renderYears(); render(); });
  $('t-jalon').onclick = function () { if (!editing) return; editing.type = 'jalon'; editing.end = editing.start; $('f-end').value = editing.end; markDirty(); syncType(); updateDuration(); renderMilestoneList(); render(); };
  $('t-periode').onclick = function () {
    if (!editing) return; editing.type = 'periode';
    if (!validISO(editing.end) || parseD(editing.end) <= parseD(editing.start)) { editing.end = iso(parseD(editing.start) + 14 * DAY); $('f-end').value = editing.end; }
    markDirty(); syncType(); updateDuration(); renderMilestoneList(); render();
  };

  // ---------- Gestion des catégories ----------
  function openCats() {
    if (editing) { $('drawer').classList.remove('on'); }
    renderCatList(); $('cat-drawer').classList.add('on'); document.body.classList.add('drawer-open');
  }
  function closeCats(silent) {
    $('cat-drawer').classList.remove('on');
    if (silent) return;
    if (editing) { fillCategorySelect(editing.category); renderColors(); $('drawer').classList.add('on'); } else document.body.classList.remove('drawer-open');
  }
  function renameCategory(cat, newName) {
    newName = (newName || '').trim(); if (!newName || newName === cat.name) return;
    if (DATA.categories.some(function (c) { return c !== cat && c.name === newName; })) { toast('Une catégorie porte déjà ce nom.'); return; }
    DATA.items.forEach(function (it) { if (it.category === cat.name) it.category = newName; });
    if (state.hidden[cat.name]) { state.hidden[newName] = true; delete state.hidden[cat.name]; }
    cat.name = newName;
  }
  function renderCatList() {
    var list = $('cat-list'); list.innerHTML = '';
    DATA.categories.forEach(function (cat, i) {
      var n = DATA.items.filter(function (it) { return it.category === cat.name; }).length;
      var row = document.createElement('div'); row.className = 'crow';
      var col = document.createElement('input'); col.type = 'color'; col.value = cat.color; col.title = 'Couleur';
      col.oninput = function () { cat.color = col.value; markDirty(); renderLegend(); renderMinimap(); render(); };
      var name = document.createElement('input'); name.type = 'text'; name.value = cat.name;
      name.onchange = function () { renameCategory(cat, name.value); name.value = cat.name; markDirty(); renderLegend(); render(); };
      var acts = document.createElement('div'); acts.className = 'acts';
      var up = document.createElement('button'); up.textContent = '↑'; up.title = 'Monter'; up.disabled = i === 0;
      up.onclick = function () { DATA.categories.splice(i - 1, 0, DATA.categories.splice(i, 1)[0]); markDirty(); renderLegend(); renderCatList(); };
      var down = document.createElement('button'); down.textContent = '↓'; down.title = 'Descendre'; down.disabled = i === DATA.categories.length - 1;
      down.onclick = function () { DATA.categories.splice(i + 1, 0, DATA.categories.splice(i, 1)[0]); markDirty(); renderLegend(); renderCatList(); };
      var del = document.createElement('button'); del.className = 'del'; del.textContent = '×'; del.title = 'Supprimer';
      del.onclick = function () {
        var others = DATA.categories.filter(function (c) { return c !== cat; });
        if (n && !others.length) { toast('Impossible : c\'est la seule catégorie et elle contient des projets.'); return; }
        var msg = n ? 'Supprimer « ' + cat.name + ' » ? Ses ' + n + ' projet(s) seront déplacés vers « ' + others[0].name + ' ».' : 'Supprimer « ' + cat.name + ' » ?';
        if (!confirm(msg)) return;
        if (n) DATA.items.forEach(function (it) { if (it.category === cat.name) it.category = others[0].name; });
        DATA.categories = others; delete state.hidden[cat.name];
        markDirty(); renderLegend(); renderMinimap(); renderCatList(); render();
      };
      acts.appendChild(up); acts.appendChild(down); acts.appendChild(del);
      var cnt = document.createElement('small'); cnt.textContent = n + ' projet' + (n > 1 ? 's' : '');
      row.appendChild(col); row.appendChild(name); row.appendChild(acts); row.appendChild(cnt); list.appendChild(row);
    });
  }
  $('c-add').onclick = function () {
    var k = 1, nm; do { nm = 'Nouvelle catégorie' + (k > 1 ? ' ' + k : ''); k++; } while (DATA.categories.some(function (c) { return c.name === nm; }));
    DATA.categories.push({ name: nm, color: PALETTE[DATA.categories.length % PALETTE.length] });
    markDirty(); renderLegend(); renderCatList();
    var inputs = $('cat-list').querySelectorAll('input[type=text]'); var last = inputs[inputs.length - 1]; last.focus(); last.select();
  };
  $('btn-cats').onclick = function () { if ($('cat-drawer').classList.contains('on')) closeCats(); else openCats(); };
  $('c-close').onclick = function () { closeCats(); }; $('c-ok').onclick = function () { closeCats(); };
  $('d-close').onclick = closeDrawer; $('d-ok').onclick = closeDrawer;
  $('d-delete').onclick = function () {
    if (!editing) return; if (!confirm('Supprimer « ' + editing.title + ' » ?')) return;
    DATA.items = DATA.items.filter(function (it) { return it.id !== editing.id; }); markDirty(); closeDrawer();
  };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('cat-drawer').classList.contains('on')) closeCats(); else if (editing) closeDrawer(); } });

  // ---------- Ajout ----------
  $('btn-add').onclick = function () {
    var start = todayISO(); var R = range(); if (parseD(start) < R.s || parseD(start) >= R.e) start = iso(R.s);
    if (!DATA.categories.length) DATA.categories.push({ name: 'Général', color: PALETTE[0] });
    var cat = DATA.categories[0].name;
    var it = { id: 'p-' + Date.now().toString(36), title: 'Nouveau projet', type: 'jalon', start: start, end: start, category: cat, owner: '', status: DATA.statuses[0], description: '' };
    DATA.items.push(it); state.hidden[cat] = false; renderLegend(); markDirty(); openDrawer(it.id); scrollTo(parseD(start));
    setTimeout(function () { $('f-title').focus(); $('f-title').select(); }, 260);
  };

  // ---------- Enregistrer et générer ----------
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 5000); }
  function savedInfo() { $('saved-info').textContent = DATA.meta.savedAt ? 'Enregistré le ' + new Date(DATA.meta.savedAt).toLocaleString('fr-FR') : ''; }
  $('btn-save').onclick = function () {
    DATA.meta.savedAt = new Date().toISOString();
    var json = JSON.stringify(DATA, null, 2).replace(/<\//g, '<\\/');
    var re = new RegExp('<script id="retro-data"[^>]*>[\\s\\S]*?<\\/script>');
    var block = '<script id="retro-data" type="application/json">\n' + json + '\n</scr' + 'ipt>';
    if (!re.test(TEMPLATE)) { alert('Impossible de retrouver le bloc de données dans le fichier.'); return; }
    var html = TEMPLATE.replace(re, function () { return block; });
    var d = new Date(); var pad = function (n) { return String(n).padStart(2, '0'); };
    var name = 'retroplanning_expat_' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '_' + pad(d.getHours()) + 'h' + pad(d.getMinutes()) + '.html';
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    state.dirty = false; $('dirty').classList.remove('on'); savedInfo();
    toast('Fichier généré : ' + name + ' (dossier Téléchargements)');
  };
  window.addEventListener('beforeunload', function (e) { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- Init ----------
  document.title = DATA.meta.title || document.title;
  $('app-title').textContent = DATA.meta.title || 'Rétroplanning'; $('app-subtitle').textContent = DATA.meta.subtitle || '';
  savedInfo(); renderLegend(); renderYears(); render();
  // Centre la vue sur aujourd'hui (ou sur le premier projet).
  var t0 = parseD(todayISO()); var R0 = range();
  if (t0 < R0.s || t0 >= R0.e) { var first = DATA.items.map(function (i) { return i.start; }).filter(validISO).sort()[0]; if (first) t0 = parseD(first); }
  stage.scrollLeft = (t0 - geo.s) / DAY * geo.pxDay + 60 - stage.clientWidth / 2;
  syncNav();
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(render, 120); });
})();
</script>
